<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>屏幕问答 · 账号管理</title>
<style>
  :root{--bg:#0a0c10;--card:#131820;--line:#232b38;--tx:#e9ecf2;--dim:#98a2b3;--muted:#6a7486;
        --ac:#4d9dff;--ok:#3ddc84;--warn:#f5a623;--red:#ff6b6b;--shadow:0 20px 44px -32px rgba(77,157,255,.55)}
  :root[data-theme="light"]{--bg:#f6f8fb;--card:#fff;--line:#e3e9f2;--tx:#111827;--dim:#5b6472;
        --muted:#7b8494;--ac:#2563eb;--ok:#12915a;--warn:#b26a00;--red:#d33;
        --shadow:0 18px 40px -30px rgba(37,99,235,.4)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.6 "Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
       background-image:radial-gradient(1100px 520px at 88% -14%,rgba(77,157,255,.14),transparent 60%);}
  .wrap{max-width:1120px;margin:0 auto;padding:26px 18px 60px}
  h1{font-size:20px;margin:0}
  .sub{color:var(--dim);font-size:12.5px;margin:4px 0 0}
  .glass{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  .hidden{display:none!important}

  /* 顶部 */
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;
        background:linear-gradient(145deg,#6fb4ff,#2f6fd0);box-shadow:0 0 0 1px rgba(142,195,255,.55),0 10px 22px -14px rgba(77,157,255,.85)}
  .top .sp{flex:1}
  .btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;
       padding:8px 14px;font:600 13px inherit;cursor:pointer;transition:border-color .16s,color .16s,transform .12s,filter .16s}
  .btn:hover{border-color:var(--ac);color:var(--ac)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{border:0;color:#06101f;background:linear-gradient(135deg,#79baff,#2f7df6);
       box-shadow:0 12px 24px -18px rgba(77,157,255,.95),inset 0 1px 0 rgba(255,255,255,.4)}
  .btn.primary:hover{filter:brightness(1.06);color:#06101f}
  .btn.ghost{background:transparent}
  .btn.sm{padding:5px 10px;border-radius:8px;font-size:12px}
  .btn:disabled{opacity:.55;cursor:default}

  /* 登录门 */
  .gate{max-width:440px;margin:10vh auto 0;padding:24px}
  .gate h2{margin:0 0 4px;font-size:17px}
  .gate p{margin:0 0 16px;color:var(--dim);font-size:12.5px}
  .field{display:block;margin:0 0 12px}
  .field input{width:100%;height:46px;border-radius:11px;border:1px solid var(--line);background:rgba(8,11,16,.6);
       color:var(--tx);padding:0 14px;font:14px inherit;outline:none;transition:border-color .16s,box-shadow .16s}
  :root[data-theme="light"] .field input{background:#fff}
  .field input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(77,157,255,.17)}
  .msg{min-height:18px;font-size:12.5px;color:var(--dim);margin-top:2px}
  .msg.err{color:var(--red)}

  /* 统计卡 */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
  .stat{padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);min-height:88px;box-sizing:border-box}
  .stat .k{font-size:12px;color:var(--dim)}
  .stat .v{font-size:22px;font-weight:800;letter-spacing:.3px;margin-top:4px;
       background:linear-gradient(120deg,var(--tx),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat .v small{font-size:12px;font-weight:600;color:var(--dim);-webkit-text-fill-color:var(--dim)}
  .stat .s{font-size:11.5px;color:var(--dim);margin-top:3px}

  /* 表格 */
  .panel{padding:16px;border-radius:16px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .search{position:relative;flex:1;min-width:200px}
  .search input{width:100%;height:38px;border-radius:10px;border:1px solid var(--line);background:rgba(8,11,16,.5);
       color:var(--tx);padding:0 12px 0 34px;font:13px inherit;outline:none}
  :root[data-theme="light"] .search input{background:#fff}
  .search input:focus{border-color:var(--ac)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.65}
  .tw{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
  th,td{padding:9px 12px;text-align:left;white-space:nowrap}
  thead th{background:rgba(77,157,255,.07);color:var(--dim);font-weight:600;font-size:12px;position:sticky;top:0}
  tbody tr{border-top:1px solid var(--line)}
  tbody tr:hover{background:rgba(120,150,190,.06)}
  td.name{font-weight:700}
  .pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .pill.on{color:var(--ok);border-color:rgba(61,220,132,.4);background:rgba(61,220,132,.1)}
  .pill.off{color:var(--red);border-color:rgba(255,107,107,.42);background:rgba(255,107,107,.1)}
  .bar{width:96px;height:6px;border-radius:4px;background:rgba(120,150,190,.18);overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
  .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#6fb4ff,#2f7df6)}
  .bar.hot i{background:linear-gradient(90deg,#ffb15c,#ff6b6b)}
  .q{font-variant-numeric:tabular-nums;color:var(--dim)}
  .ops{display:flex;gap:6px}
  .empty{padding:34px;text-align:center;color:var(--dim);font-size:13px}
  .foot{color:var(--muted);font-size:11.5px;margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#0f1725;color:#e9ecf2;
       border:1px solid #2b3b52;box-shadow:0 16px 40px rgba(0,0,0,.45);padding:10px 16px;border-radius:10px;font-size:13px;
       opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30}
  :root[data-theme="light"] .toast{background:#fff;color:#111827;border-color:#dbe4f0}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{border-color:rgba(255,107,107,.6)}

  /* 弹窗 */
  .modal-mask{position:fixed;inset:0;background:rgba(4,7,12,.62);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:20}
  .modal{width:min(400px,92vw);padding:20px;border-radius:16px}
  .modal h3{margin:0 0 4px;font-size:16px}
  .modal p{margin:0 0 14px;color:var(--dim);font-size:12.5px}
  .modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
  .theme-btn{position:fixed;right:16px;bottom:16px;z-index:10}
</style>
</head>
<body>
<div class="wrap">

  <!-- 令牌门 -->
  <section id="gate" class="glass gate">
    <h2>账号管理后台</h2>
    <p>输入管理令牌（服务器环境变量 SQA_ADMIN_TOKEN）后进入。</p>
    <label class="field"><input id="gateToken" type="password" placeholder="管理令牌" autocomplete="off" /></label>
    <div id="gateMsg" class="msg"></div>
    <div style="margin-top:12px"><button id="gateBtn" class="btn primary" style="width:100%">进入后台</button></div>
    <div style="margin-top:10px;color:var(--muted);font-size:11.5px">令牌只存在本标签页的 sessionStorage，不写 cookie。</div>
  </section>

  <!-- 主界面 -->
  <div id="app" class="hidden">
    <div class="top">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
          <rect x="3.5" y="4.5" width="17" height="12" rx="2.4"/><path d="M9 20h6"/><path d="M12 16.5V20"/>
        </svg>
      </div>
      <div>
        <h1>屏幕问答 · 账号管理</h1>
        <div class="sub" id="subline">管理注册账号、额度与停用状态</div>
      </div>
      <div class="sp"></div>
      <button id="btnRefresh" class="btn">刷新</button>
      <button id="btnCsv" class="btn">导出 CSV</button>
      <button id="btnTheme" class="btn ghost">☀️ 日间</button>
      <button id="btnExit" class="btn ghost">退出</button>
    </div>

    <div class="stats" id="stats"></div>

    <section class="glass panel">
      <div class="toolbar">
        <div class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/>
          </svg>
          <input id="q" placeholder="搜索用户名（回车查询）" autocomplete="off" />
        </div>
        <button id="btnSearch" class="btn">查询</button>
        <span class="q" id="countLine"></span>
      </div>
      <div class="tw">
        <table>
          <thead><tr>
            <th>用户名</th><th>状态</th><th>今日用量</th><th>额度/天</th><th>累计 tokens</th>
            <th>记录</th><th>最近使用</th><th>注册时间</th><th>操作</th>
          </tr></thead>
          <tbody id="rows"><tr><td colspan="9" class="empty">加载中…</td></tr></tbody>
        </table>
      </div>
      <div class="foot">
        <span id="footInfo"></span>
        <span>·</span>
        <span>数据库：服务器 SQLite（data/sqa.db）</span>
      </div>
    </section>
  </div>

  <div id="toast" class="toast"></div>
  <button id="btnThemeFab" class="btn theme-btn ghost">☀️ 日间</button>
</div>

<div id="modalMask" class="modal-mask hidden"><div class="modal glass" id="modalBox"></div></div>

<script>
(function(){
  "use strict";
  var TOKEN_KEY = "sqa_admin_token";
  var token = sessionStorage.getItem(TOKEN_KEY) || "";
  var rowsCache = [];
  var $ = function(id){ return document.getElementById(id); };

  // ---------- 主题 ----------
  var THEME_KEY = "sqa_theme";
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    var label = t === "light" ? "🌙 夜间" : "☀️ 日间";
    $("btnTheme").textContent = label;
    $("btnThemeFab").textContent = label;
  }
  function toggleTheme(){
    var next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  }
  applyTheme(localStorage.getItem(THEME_KEY) || "dark");
  $("btnTheme").onclick = toggleTheme;
  $("btnThemeFab").onclick = toggleTheme;

  // ---------- 请求 ----------
  function api(path, opts){
    opts = opts || {};
    return fetch(path, {
      method: opts.body ? "POST" : "GET",
      headers: {"X-Admin-Token": token, "Content-Type": "application/json"},
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      cache: "no-store"
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(j){
        if (!r.ok) { var e = new Error(j.error || ("HTTP " + r.status)); e.status = r.status; throw e; }
        return j;
      });
    });
  }

  function toast(msg, isErr){
    var t = $("toast");
    t.textContent = msg;
    t.className = "toast show" + (isErr ? " err" : "");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.className = "toast"; }, 2200);
  }

  function fmtTime(ts){
    if (!ts) return "—";
    var d = new Date(ts * 1000);
    var p = function(n){ return n < 10 ? "0" + n : "" + n; };
    return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function fmtNum(n){
    n = Number(n || 0);
    if (n >= 1e6) return (n/1e6).toFixed(1) + "M";
    if (n >= 1e3) return (n/1e3).toFixed(1) + "k";
    return String(n);
  }

  // ---------- 渲染 ----------
  function renderStats(o){
    var cells = [
      ["账号总数", o.users, o.disabled ? ("停用 " + o.disabled) : ""],
      ["今日新增", o.new_today, "近 7 天活跃 " + o.active_7d],
      ["有效令牌", fmtNum(o.tokens), "记录 " + fmtNum(o.records)],
      ["今日 tokens", fmtNum(o.today.tokens), "花费 ¥" + Number(o.today.cost || 0).toFixed(4)],
      ["累计 tokens", fmtNum(o.total.tokens), "花费 ¥" + Number(o.total.cost || 0).toFixed(4)],
      ["今日请求", fmtNum(o.today.n), "累计 " + fmtNum(o.total.n)]
    ];
    $("stats").innerHTML = cells.map(function(c){
      return '<div class="stat"><div class="k">' + c[0] + '</div><div class="v">' + c[1] + '</div>' +
             (c[2] ? '<div class="s">' + c[2] + '</div>' : '') + '</div>';
    }).join("");
  }

  function renderRows(data){
    rowsCache = data.items || [];
    $("countLine").textContent = "共 " + data.total + " 个账号";
    if (!rowsCache.length) {
      $("rows").innerHTML = '<tr><td colspan="9" class="empty">没有匹配的账号</td></tr>';
      return;
    }
    $("rows").innerHTML = rowsCache.map(function(u, i){
      var quota = Math.max(0, Number(u.quota_day) || 0);
      var used = Math.max(0, Number(u.used_today) || 0);
      var pct = quota > 0 ? Math.min(100, Math.round(used / quota * 100)) : (used > 0 ? 100 : 0);
      var hot = pct >= 85 ? " hot" : "";
      var on = u.status !== "disabled";
      return "<tr>" +
        '<td class="name">' + esc(u.name) + "</td>" +
        '<td><span class="pill ' + (on ? "on" : "off") + '">' + (on ? "正常" : "已停用") + "</span></td>" +
        '<td><span class="bar' + hot + '"><i style="width:' + pct + '%"></i></span>' +
          '<span class="q">' + fmtNum(used) + " / " + fmtNum(quota) + "</span></td>" +
        '<td class="q">' + fmtNum(quota) + "</td>" +
        '<td class="q">' + fmtNum(u.tokens_total) + "</td>" +
        '<td class="q">' + fmtNum(u.records) + "</td>" +
        '<td class="q">' + fmtTime(u.last_used) + "</td>" +
        '<td class="q">' + fmtTime(u.created_at) + "</td>" +
        '<td><div class="ops">' +
          '<button class="btn sm" data-act="quota" data-i="' + i + '">改额度</button>' +
          '<button class="btn sm" data-act="toggle" data-i="' + i + '">' + (on ? "停用" : "启用") + "</button>" +
          '<button class="btn sm" data-act="revoke" data-i="' + i + '">踢下线</button>' +
        "</div></td></tr>";
    }).join("");
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // ---------- 数据加载 ----------
  function loadAll(){
    var q = $("q").value.trim();
    return Promise.all([
      api("/api/admin/overview"),
      api("/api/admin/users?limit=200&q=" + encodeURIComponent(q))
    ]).then(function(res){
      renderStats(res[0].overview);
      renderRows(res[1]);
      $("gate").classList.add("hidden");
      $("app").classList.remove("hidden");
      $("subline").textContent = "已连接 · " + (res[0].overview.users) + " 个账号";
    });
  }

  // ---------- 操作 ----------
  function setQuota(u){
    openModal({
      title: "修改每日额度",
      desc: "账号「" + u.name + "」当前额度 " + fmtNum(u.quota_day) + " tokens/天。填 0 表示禁止使用。",
      value: String(u.quota_day),
      okText: "保存",
      onOk: function(v){
        var n = parseInt(v, 10);
        if (!(n >= 0 && n <= 10000000)) { toast("额度需在 0 ~ 10000000 之间", true); return false; }
        return api("/api/admin/quota", {body: {name: u.name, quota_day: n}}).then(function(){
          toast("已更新额度"); closeModal(); return loadAll();
        });
      }
    });
  }

  function toggleStatus(u){
    var on = u.status !== "disabled";
    var ask = on ? "停用后该账号立即无法登录、已登录的令牌也会失效，确定停用？" : "确定恢复这个账号？";
    openModal({
      title: on ? "停用账号" : "恢复账号",
      desc: "账号「" + u.name + "」" + ask,
      okText: on ? "停用" : "恢复",
      danger: on,
      onOk: function(){
        return api("/api/admin/status", {body: {name: u.name, status: on ? "disabled" : "active"}}).then(function(){
          toast(on ? "已停用" : "已恢复"); closeModal(); return loadAll();
        });
      }
    });
  }

  function revoke(u){
    openModal({
      title: "踢下线",
      desc: "让账号「" + u.name + "」在所有设备上的登录状态立即失效（余额/记录不受影响）。",
      okText: "全部下线",
      onOk: function(){
        return api("/api/admin/revoke", {body: {name: u.name}}).then(function(){
          toast("已踢下线"); closeModal(); return loadAll();
        });
      }
    });
  }

  // ---------- 弹窗 ----------
  function openModal(cfg){
    var box = $("modalBox");
    box.innerHTML = "<h3>" + esc(cfg.title) + "</h3><p>" + esc(cfg.desc) + "</p>" +
      (cfg.value !== undefined ? '<label class="field"><input id="modalInput" value="' + esc(cfg.value) + '" /></label>' : "") +
      '<div class="row"><button class="btn" id="modalCancel">取消</button>' +
      '<button class="btn ' + (cfg.danger ? "" : "primary") + '" id="modalOk">' + esc(cfg.okText || "确定") + "</button></div>";
    $("modalMask").classList.remove("hidden");
    var ok = $("modalOk");
    var busy = false;
    ok.onclick = function(){
      if (busy) return;
      var v = cfg.value !== undefined ? ($("modalInput").value || "") : undefined;
      busy = true;
      Promise.resolve(cfg.onOk(v)).catch(function(e){ toast(e.message || "操作失败", true); busy = false; });
    };
    $("modalCancel").onclick = closeModal;
    $("modalMask").onclick = function(e){ if (e.target === $("modalMask")) closeModal(); };
    var inp = $("modalInput");
    if (inp) { inp.focus(); inp.select(); inp.onkeydown = function(e){ if (e.key === "Enter") ok.click(); }; }
  }
  function closeModal(){ $("modalMask").classList.add("hidden"); }

  // ---------- 登录门 ----------
  function enter(){
    var tk = $("gateToken").value.trim() || token;
    if (!tk) { $("gateMsg").textContent = "请先填管理令牌"; $("gateMsg").className = "msg err"; return; }
    token = tk;
    $("gateBtn").disabled = true;
    $("gateMsg").textContent = "验证中…";
    $("gateMsg").className = "msg";
    api("/api/admin/overview").then(function(){
      sessionStorage.setItem(TOKEN_KEY, token);
      return loadAll();
    }).catch(function(e){
      $("gateMsg").textContent = e.status === 403 ? "令牌不对（或服务器未设置 SQA_ADMIN_TOKEN）" : ("连接失败：" + e.message);
      $("gateMsg").className = "msg err";
    }).finally(function(){ $("gateBtn").disabled = false; });
  }

  // ---------- 事件 ----------
  $("gateBtn").onclick = enter;
  $("gateToken").onkeydown = function(e){ if (e.key === "Enter") enter(); };
  $("btnRefresh").onclick = function(){ loadAll().then(function(){ toast("已刷新"); }).catch(function(e){ toast(e.message, true); }); };
  $("btnSearch").onclick = function(){ loadAll().catch(function(e){ toast(e.message, true); }); };
  $("q").onkeydown = function(e){ if (e.key === "Enter") $("btnSearch").click(); };
  $("btnCsv").onclick = function(){
    var url = "/api/admin/export.csv?token=" + encodeURIComponent(token);
    var a = document.createElement("a");
    a.href = url; a.download = "sqa-users.csv";
    document.body.appendChild(a); a.click(); a.remove();
  };
  $("btnExit").onclick = function(){
    sessionStorage.removeItem(TOKEN_KEY); token = "";
    $("app").classList.add("hidden"); $("gate").classList.remove("hidden"); $("gateToken").value = "";
  };
  $("rows").onclick = function(e){
    var b = e.target.closest("button[data-act]");
    if (!b) return;
    var u = rowsCache[parseInt(b.getAttribute("data-i"), 10)];
    if (!u) return;
    var act = b.getAttribute("data-act");
    if (act === "quota") setQuota(u);
    else if (act === "toggle") toggleStatus(u);
    else if (act === "revoke") revoke(u);
  };

  // 从 ?token= 直接进入（方便收藏/脚本）
  var qs = new URLSearchParams(location.search);
  if (qs.get("token")) {
    $("gateToken").value = qs.get("token");
    enter();
  } else if (token) {
    enter();
  }
})();
</script>
</body>
</html>
